<!DOCTYPE html>
<html>

<head>
    <title>Odd and Even Numbers</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <h2>Check Odd or Even Numbers from 0 to 15</h2>

    <script>

        for (let i = 0; i <= 15; i++) {

            if (i % 2 == 0) {
                document.write(i + " is Even <br>");
            }
            else {
                document.write(i + " is Odd <br>");
            }

        }

    </script>

</body>

</html>
