<!DOCTYPE html>
<html>
<head>
    <title>Find Sign of Product</title>
</head>
<body>

<script>
    function findSign(a, b, c) {
        let product = a * b * c;

        if (product > 0) {
            alert("The sign is plus (+)");
        } 
        else if (product < 0) {
            alert("The sign is minus (-)");
        } 
        else {
            alert("The product is zero (0)");
        }
    }

    // Taking input from user
    let num1 = parseInt(prompt("Enter first number:"));
    let num2 = parseInt(prompt("Enter second number:"));
    let num3 = parseInt(prompt("Enter third number:"));

    // Call function
    findSign(num1, num2, num3);
</script>

</body>
</html>
