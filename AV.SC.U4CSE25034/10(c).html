<!DOCTYPE html>
<html>

<head>
    <title>Largest of Five Numbers</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 90px;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: darkgreen;
        }
    </style>
</head>

<body>

    <h2>Find the Largest of Five Numbers</h2>

    <input type="number" id="num1" placeholder="Number 1">
    <input type="number" id="num2" placeholder="Number 2">
    <input type="number" id="num3" placeholder="Number 3">
    <input type="number" id="num4" placeholder="Number 4">
    <input type="number" id="num5" placeholder="Number 5">

    <br>

    <button onclick="findLargest()">Find Largest</button>

    <p id="result"></p>

    <script>

        // Function to find the largest number
        function findLargest() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let c = Number(document.getElementById("num3").value);
            let d = Number(document.getElementById("num4").value);
            let e = Number(document.getElementById("num5").value);

            let largest;

            if (a >= b && a >= c && a >= d && a >= e) {
                largest = a;
            }
            else if (b >= a && b >= c && b >= d && b >= e) {
                largest = b;
            }
            else if (c >= a && c >= b && c >= d && c >= e) {
                largest = c;
            }
            else if (d >= a && d >= b && d >= c && d >= e) {
                largest = d;
            }
            else {
                largest = e;
            }

            document.getElementById("result").innerHTML =
                "Largest Number is: " + largest;
        }

    </script>

</body>

</html>
